<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moneda (MXN a USD)</title>
    <!-- Enlace a la hoja de estilos -->
    <link rel="stylesheet" href="css/ejercicio12.css">
    <link href="https://fonts.googleapis.com/css?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor">
        <h1>Conversor de Moneda</h1>
        
        <!-- Campo de entrada para Pesos Mexicanos -->
        <div class="grupo-input">
            <label for="mxn">Pesos Mexicanos (MXN):</label>
            <input type="text" id="mxn" placeholder="Ej: 500">
        </div>

        <!-- Botón para iniciar la conversión -->
        <button type="button" id="btnConvertir" onclick="convertirMoneda()">Convertir</button>

        <!-- Caja de texto de solo lectura para el resultado -->
        <div class="grupo-input">
            <label for="usd">Dólares Estadounidenses (USD):</label>
            <input type="text" id="usd" readonly placeholder="Resultado" class="readonly-input">
        </div>

        <!-- Div para mostrar mensajes de error de validación -->
        <div id="mensajeError" class="error"></div>
    </div>

    <!-- Script de JavaScript -->
    <script src="js/ejercicio12.js"></script>
</body>
</html>
