<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulación del DOM con Bootstrap</title>
    
    <!-- Enlace a Bootstrap 5 (CSS) para diseño responsivo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Enlace a tu hoja de estilos personalizada -->
    <link rel="stylesheet" href="css/ejercicio18.css">
    
    <!-- Enlace a SweetAlert2 para mejorar las alertas[cite: 11] -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- Uso de clases Bootstrap: container, mt-5 (margin-top), justify-content-center[cite: 11] -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- Tarjeta de Bootstrap para un diseño moderno -->
                <div class="card shadow-lg border-0">
                    <div class="card-header text-white text-center py-3">
                        <h2 class="h4 mb-0">Agregar y Eliminar Elementos</h2>
                    </div>
                    
                    <div class="card-body p-4">
                        <!-- Grupo de input y botón combinados -->
                        <div class="input-group mb-4">
                            <input type="text" id="nuevoElemento" class="form-control form-control-lg" placeholder="Escribe algo...">
                            <button class="btn btn-agregar px-4" id="agregarBtn" type="button">Agregar</button>
                        </div>
                        
                        <!-- Lista dinámica con clases de Bootstrap (list-group)[cite: 11] -->
                        <ul id="lista" class="list-group">
                            <!-- Los elementos se insertarán aquí con JS -->
                        </ul>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Script de JavaScript -->
    <script src="js/ejercicio18.js"></script>
</body>
</html>
