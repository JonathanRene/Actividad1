<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora con Funciones Flecha</title>
    <!-- Enlace a la hoja de estilos -->
    <link rel="stylesheet" href="css/ejercicio16.css">
    <link href="https://fonts.googleapis.com/css?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Enlace a la librería SweetAlert2 (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="contenedor">
        <h1>Calculadora Básica</h1>
        
        <!-- Campos de entrada para los números -->
        <div class="grupo-input">
            <label for="numero1">Número 1:</label>
            <input type="text" id="numero1" placeholder="Ej: 15">
        </div>

        <div class="grupo-input">
            <label for="numero2">Número 2:</label>
            <input type="text" id="numero2" placeholder="Ej: 5">
        </div>

        <!-- Botones para cada operación -->
        <div class="grupo-botones">
            <button type="button" onclick="calcularOperacion('suma')">Sumar (+)</button>
            <button type="button" onclick="calcularOperacion('resta')">Restar (-)</button>
            <button type="button" onclick="calcularOperacion('multiplicacion')">Multiplicar (x)</button>
            <button type="button" onclick="calcularOperacion('division')">Dividir (÷)</button>
        </div>

        <!-- Caja de texto de solo lectura para el resultado -->
        <div class="grupo-input">
            <label for="resultado">Resultado:</label>
            <input type="text" id="resultado" readonly placeholder="El resultado aparecerá aquí" class="readonly-input">
        </div>
    </div>

    <!-- Script de JavaScript -->
    <script src="js/ejercicio16.js"></script>
</body>
</html>
